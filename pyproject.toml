
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentmodpy"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "hypomodpy",
  "numpy",
  "wxPython"
]

[tool.setuptools]
packages = ["AgentModPy"]
include-package-data = true

[tool.setuptools.package-dir]
AgentModPy = "."